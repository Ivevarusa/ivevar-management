<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23161d26%22/%3E%3Cpath d=%22M20 24h24l-12 22z%22 fill=%22%23d6a64c%22/%3E%3Cpath d=%22M20 24l6-8h12l6 8z%22 fill=%22%23f0cf86%22/%3E%3C/svg%3E"></head><body><title>Ivevar Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap">
<style>
/* Layout: fixed graphite rail of 18 modules + work surface; gold is used only for primary actions and fine-metal figures */
:root{
  --bg:#f8f3ea; --surface:#fffdf9; --surface2:#f6f0e6; --ink:#1b2033; --muted:#6b6a72; --line:#ece3d4;
  --accent:#e8820c; --accent-soft:#fdeedb; --accent-ink:#ffffff; --navy:#151b3d; --navy2:#232c57;
  --rail:#141a3a; --rail2:#1b2350; --rail-ink:#d7dbef; --rail-active:#e8820c; --rail-brand:#ffb44d;
  --good:#1d7447; --good-soft:#e2f3ea; --warn:#a35f00; --warn-soft:#fbefdc; --bad:#b0281f; --bad-soft:#fbe5e3; --info:#2458a6; --info-soft:#e4ecf8;
  --pri:var(--accent); --pri-ink:var(--accent-ink);
  --f-ui:"Inter","Instrument Sans","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%;background:linear-gradient(90deg,var(--rail2) 0 232px,transparent 232px)}
.rail{background:linear-gradient(180deg,var(--rail) 0%,var(--rail2) 100%);color:var(--rail-ink);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{padding:20px 18px 16px;border-bottom:1px solid #ffffff14}
.brand b{display:block;color:var(--rail-brand);font-size:19px;letter-spacing:.01em}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-brand);opacity:.85;font-weight:600}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav a.gtop{margin-top:6px}
.railfoot{margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff14;display:flex;flex-direction:column;gap:9px}
.rf-user b{color:#fff;font-size:13.5px;display:block;line-height:1.2}
.rf-sub{font-size:11px;color:var(--rail-ink);opacity:.72;margin-top:3px}
.rf-lang{width:100%;padding:7px 10px;border-radius:9px;background:#fff;color:#1a2240;border:1px solid #ffffff22;font-size:12.5px;cursor:pointer}
.rf-lang option{color:#1a2240;background:#fff}
.rf-links{font-size:12px;color:var(--rail-ink);opacity:.9}
.rf-links a{color:var(--rail-brand);cursor:pointer;text-decoration:none}
.rf-links a:hover{text-decoration:underline}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--rail-ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px #0005}
.nav a .ct{margin-left:auto;font-family:var(--f-num);font-size:11px;background:var(--surface2);border-radius:9px;padding:0 6px}
.nav a .ct.hot{background:var(--bad);color:#fff}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav a.on svg{opacity:1}
.navic{display:inline-flex;align-items:center;justify-content:center}
svg.icn{width:18px;height:18px}
.cap svg.icn{width:17px;height:17px;color:var(--accent);flex:none}
h2 svg.icn,h3 svg.icn{width:18px;height:18px;vertical-align:-3px}
.btn svg.icn{width:15px;height:15px;vertical-align:-2px;margin-right:3px}
.cap2 svg.icn{width:17px;height:17px;color:var(--accent);vertical-align:-3px;margin-right:5px}
.setcontact a svg.icn,.setrow svg.icn{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.menuBtn{display:none}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.sres{position:absolute;top:110%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px #0003;max-height:60vh;overflow:auto;z-index:20}
.sres a{display:flex;gap:8px;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--surface2)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}
.content{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:none;width:100%}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.phead .sub{color:var(--muted);font-size:13px;flex-basis:100%;margin-top:-6px}
.phead .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.dng{color:var(--bad)}
.btn.good{color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #6b4a1a0d;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:500}
.kpi{background:var(--surface2)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.kpi.gold .v{color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.num,td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ref{font-family:var(--f-num);font-size:12.5px;color:var(--info);white-space:nowrap}
.fine{color:var(--accent);font-weight:500}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.gold{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tools input,.tools select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.col h4{margin:2px 4px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;font-size:13px}
.tile:hover{border-color:var(--accent)}
.tile .meta{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.tile.over{box-shadow:inset 3px 0 0 var(--bad)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);font-size:13px;cursor:pointer}
.alert .sev{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{padding:0 0 10px 14px;position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline small{color:var(--muted);display:block}
.route{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.route span{font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.route span.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.route span.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:#0a0e1399;z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:min(920px,100%);box-shadow:0 20px 60px #0006;display:flex;flex-direction:column}
.modal.wide{width:min(1180px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0}
.mh .x{margin-left:auto}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
/* ============ premium sectioned form (Create Order) — scoped to .fpro, leaves every other form untouched ============ */
.modal.fpro{width:min(1080px,100%)}
.modal.fpro .mh{padding:16px 22px;background:var(--surface)}
.modal.fpro .mh h2{font-size:18px}
.modal.fpro .mb{padding:0;background:var(--bg)}
.form-pro{display:flex;flex-direction:column;gap:16px;padding:18px 20px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;box-shadow:0 1px 3px #0000000d}
.fcard-h{display:flex;align-items:center;gap:11px;margin:0 0 15px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.fcard-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);font-size:16px;flex:none;color:var(--accent)}
.fcard-ic svg{width:18px;height:18px}
.fcard-h h3{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em;color:var(--ink)}
.fpro .f{gap:5px}
.fpro .f label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.fpro .f input,.fpro .f select,.fpro .f textarea{padding:0 12px;height:43px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.fpro .f textarea{height:auto;min-height:80px;padding:11px 12px;line-height:1.5}
.fpro .f select{cursor:pointer}
.fpro .f input:hover:not([readonly]),.fpro .f select:hover{border-color:var(--muted)}
.fpro .f input:focus,.fpro .f select:focus,.fpro .f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fpro .f input[readonly]{background:var(--surface2);border-style:solid;border-color:var(--line);color:var(--accent);font-family:var(--f-num);box-shadow:none}
.fpro .curbtn,.fpro .fileup{min-height:43px}
.fpro .curbtn{height:43px;border-radius:10px}
.fpro .curbtn:hover{border-color:var(--muted)}
.fpro .lines input,.fpro .lines select{height:36px;border-radius:8px;background:var(--surface)}
/* live pricing summary tiles */
.ordsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;width:100%}
.sumtile{display:flex;flex-direction:column;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.sumtile .st-l{font-size:10.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.sumtile .st-v{font-size:19px;font-weight:700;font-family:var(--f-num);line-height:1.2;color:var(--ink)}
.sumtile .st-s{font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.sumtile.good{background:var(--good-soft);border-color:#cfe8da}.sumtile.good .st-v{color:var(--good)}
.sumtile.bad{background:var(--bad-soft);border-color:#f0cfcc}.sumtile.bad .st-v{color:var(--bad)}
.sumtile.warn{background:var(--warn-soft);border-color:#eeddbb}.sumtile.warn .st-v{color:var(--warn)}
.sumtile.accent{background:var(--accent-soft);border-color:#f6d9b6}.sumtile.accent .st-v{color:var(--accent)}
/* file-upload remove control + bigger tiles in pro form */
.fprev{position:relative;display:inline-block}
.fileup-rm{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--bad);color:#fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0005;padding:0}
.fileup-rm:hover{filter:brightness(1.12)}
.fpro .fileup-prev img,.fpro .fileup-add{width:88px;height:88px}
.fpro .fileup-add{border-radius:12px}
/* sticky action footer */
.modal.fpro .mf{position:sticky;bottom:0;background:var(--surface);box-shadow:0 -2px 10px #0000000f}
.modal.fpro .mf .btn{padding:9px 16px;font-size:13.5px}
.modal.fpro .mf .btn.pri{padding:9px 24px}
@media(max-width:1100px){.ordsum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
  .ov:has(.modal.fpro){padding:0}
  .modal.fpro{width:100%;min-height:100%;border-radius:0}
  .form-pro{padding:12px;gap:13px}
  .fcard{padding:15px 15px 17px;border-radius:12px}
  .ordsum{grid-template-columns:1fr 1fr}
  .modal.fpro .mf{padding:12px 15px}
}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.f label .rq{color:var(--bad)}
.f input,.f select,.f textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);width:100%;min-width:0}
.f input[readonly]{background:transparent;border-style:dashed;color:var(--accent);font-family:var(--f-num)}
.f textarea{min-height:64px;resize:vertical}
.lines td{padding:4px}
.lines input,.lines select{width:100%;min-width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2)}
.lines td.calc{font-family:var(--f-num);text-align:right;color:var(--accent);white-space:nowrap;padding-top:9px}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbars .r{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.hbars .r .num{font-size:12px}
.perm select{padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);font-size:12px}
.att button{width:30px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);cursor:pointer;font-family:var(--f-num);font-size:12px}
.att button.P{background:var(--good-soft);color:var(--good);border-color:transparent;font-weight:600}
.att button.A{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.att button.H{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.att button.L{background:var(--info-soft);color:var(--info);border-color:transparent;font-weight:600}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;padding:8px 0}
.chk label{white-space:nowrap;justify-content:flex-start}
.chk input,.f .chk input{width:auto!important;flex:none;margin:0}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.files a,.files div{display:flex;flex-direction:column;gap:4px;width:110px;font-size:11.5px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.files img{width:110px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.inout{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:1fr 1fr auto;gap:12px 24px;align-items:center;min-height:150px}

/* ======== THEMES (Settings → Appearance) ======== */
/* Luxury Ivory — the recommended default: ivory surfaces, deep-ink headings, champagne accent, dark-ink primary buttons, deep-ink sidebar */
:root[data-theme="ivory"]{--bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede7;--ink:#18242c;--muted:#657078;--line:#ddd5c9;--accent:#b08a4a;--accent-soft:#f2ebdc;--accent-ink:#ffffff;--pri:#18242c;--pri-ink:#ffffff;--navy:#18242c;--navy2:#26343d;--rail:#141d24;--rail2:#202d37;--rail-ink:#c8cfd4;--rail-active:#b08a4a;--rail-brand:#cba96a;--good:#276a57;--good-soft:#e3efea;--warn:#a76420;--warn-soft:#f6ead9;--bad:#b54747;--bad-soft:#f6e6e6;--info:#315e8a;--info-soft:#e4ebf3}
/* Midnight Luxury — refined dark slate + champagne gold */
:root[data-theme="midnight"]{--bg:#0e151b;--surface:#17222b;--surface2:#202d37;--ink:#f3f2ee;--muted:#b6c0c7;--line:#34434e;--accent:#d5b478;--accent-soft:#2e2a1e;--accent-ink:#1a1206;--pri:#d5b478;--pri-ink:#17120a;--navy:#0a0e16;--navy2:#141b2b;--rail:#0b1218;--rail2:#141f28;--rail-ink:#c6d0d7;--rail-brand:#d5b478;--good:#37c489;--good-soft:#123024;--warn:#e0a84a;--warn-soft:#352a14;--bad:#f0685e;--bad-soft:#3a1c1a;--info:#6aa6ff;--info-soft:#17233a}
/* Royal — deep purple + gold */
:root[data-theme="royal"]{--bg:#15111f;--surface:#1f1830;--surface2:#271e3b;--ink:#efeafb;--muted:#a99fc0;--line:#352a4d;--accent:#e0b84a;--accent-soft:#33280f;--accent-ink:#1a1206;--navy:#120d1d;--navy2:#241a38;--rail:#120c1f;--rail2:#241834;--rail-ink:#d8cfeb;--rail-brand:#e8c766;--good:#49c98f;--good-soft:#16321f;--warn:#e0a84a;--warn-soft:#352a14;--bad:#f0685e;--bad-soft:#3a1c22;--info:#9d8bff;--info-soft:#221a3a}
/* Emerald — deep green + mint */

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r3=v=>Math.round(num(v)*1000)/1000;
const r2=v=>Math.round(num(v)*100)/100;
const fw=v=>num(v).toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3});
const fq=v=>num(v).toLocaleString('en-IN',{maximumFractionDigits:2});
const money=v=>(SET.currency||'₹')+' '+num(v).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0});
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const nowISO=()=>new Date().toISOString();
const fdate=d=>{if(!d)return '—';const x=new Date(d.length<=10?d+'T00:00':d);return isNaN(x)?esc(d):x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const fdt=d=>{if(!d)return '—';const x=new Date(d);return isNaN(x)?esc(d):x.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
const daysTo=d=>d?Math.floor((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5):null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}

function challanCalc(c){

function orderCost(o){

  const est=num(o.estimate)||((byId('quotes',o.quote)&&quoteTotals(byId('quotes',o.quote)).sub)||0);

/* ---------- jewellery price calculator (metal + diamonds + labor + shipping → USD × profit) ---------- */
const JW=()=>Object.assign({dollar:92,silver:500,gold24:14000,platinum:6951,goldLabor:1200,platLabor:1400,shipping:5000,labMain:14000,labSide:12000,labCompare:18,moisMain:500,moisSide:500,moisCompare:15,profit:25},SET.jewel||{});
const JMETALS=[['silver','925 Silver'],['10k','10K Gold'],['14k','14K Gold'],['18k','18K Gold'],['platinum','Platinum']];
/* spec: {type:'lab'|'mois', grams, mainCt, sideCt, profitPct}. Returns {metalKey:{cost,sell,compare}} in USD. */
function jewelCalc(spec){
  const r=JW();const type=spec.type==='mois'?'mois':'lab';
  const main=num(spec.mainCt)*(type==='mois'?num(r.moisMain):num(r.labMain));
  const side=num(spec.sideCt)*(type==='mois'?num(r.moisSide):num(r.labSide));
  const g=num(spec.grams),ship=num(r.shipping),dollar=num(r.dollar)||92;
  const profit=spec.profitPct===''||spec.profitPct==null?num(r.profit):num(spec.profitPct);
  const compare=type==='mois'?num(r.moisCompare):num(r.labCompare);
  const out={};
  JMETALS.forEach(([k])=>{
    let metalCost,labor;
    if(k==='silver'){metalCost=num(r.silver)*g;labor=0;}
    else if(k==='platinum'){metalCost=num(r.platinum)*g;labor=g*num(r.platLabor);}
    else{const pur=k==='10k'?10:k==='14k'?14:18;metalCost=num(r.gold24)*(pur/24)*g;labor=g*num(r.goldLabor);}
    const totalINR=metalCost+labor+main+side+ship;
    const cost=totalINR/dollar;
    out[k]={cost:r2(cost),sell:r2(cost*(1+profit/100)),compare:r2(cost*(1+compare/100))};
  });
  out._profit=profit;out._type=type;
  return out;
}

/* ---------- sales figures (Ivevar profit model: value − making − courier; all normalised to INR) ---------- */
const orderSeller=o=>o.salesBy||o.createdBy;
function orderSaleRaw(o){if(num(o.saleValue))return num(o.saleValue);const q=byId('quotes',o.quote);return q?quoteTotals(q).total:0}
/* Order Value (INR) = sale value × the order's locked USD→INR rate */
function orderValueINR(o){return r2(toINRat(orderSaleRaw(o),ordCur(o),ordRate(o)))}
function orderSale(o){return orderValueINR(o)}
/* Making cost: new orders use makingCostINR; old ones fall back to costPrice */
function orderMakingINR(o){return num(o.makingCostINR)||(o.costPrice?toINRat(num(o.costPrice),ordCur(o),ordRate(o)):0)}
const orderCourierINR=o=>num(o.courierINR);
const orderReceived=o=>toINRat(orderPaidRaw(o),ordCur(o),ordRate(o))+S.cash.filter(e=>e.order===o.id&&e.type==='Income').reduce((t,e)=>t+num(e.amount),0);
/* Profit Before Marketing (INR) */
function orderProfit(o){return r2(orderValueINR(o)-orderMakingINR(o)-orderCourierINR(o))}
/* Sales-executive share of profit (default 25%) */
const commPctOf=uid=>{if(typeof ME!=='undefined'&&ME&&uid===ME.id)return num(ME.commPct)||0;const u=USERS.find(x=>x.id===uid);return u?num(u.commPct)||0:0};
function orderCommission(o){return r2(orderProfit(o)*commPctOf(orderSeller(o))/100)}

/* ---------- unique-piece inventory helpers ---------- */
function pieceProfit(p){return r2(num(p.priceUSD)-num(p.costUSD))}
function pieceStats(){const all=S.pieces;const inStock=all.filter(p=>(p.status||'In stock')==='In stock');const sold=all.filter(p=>p.status==='Sold');
  return{total:all.length,inStock:inStock.length,sold:sold.length,
    stockCostUSD:inStock.reduce((s,p)=>s+num(p.costUSD),0),stockCostINR:inStock.reduce((s,p)=>s+num(p.costINR),0),
    soldSaleUSD:sold.reduce((s,p)=>s+num(p.priceUSD),0),soldProfitUSD:sold.reduce((s,p)=>s+pieceProfit(p),0)}}
function salesStats(uid,from){const live=o=>!['Cancelled','Draft'].includes(o.status)&&(!uid||orderSeller(o)===uid)&&(!from||(o.date||'')>=from);
  const os=S.orders.filter(live);const sale=os.reduce((t,o)=>t+orderSale(o),0),rev=os.reduce((t,o)=>t+orderReceived(o),0),profit=os.reduce((t,o)=>t+orderProfit(o),0);
  const leads=S.leads.filter(l=>(!uid||l.createdBy===uid)&&(!from||(l.date||'').slice(0,10)>=from));const won=leads.filter(l=>l.stage==='Won').length;
  return{orders:os,count:os.length,sale,rev,due:sale-rev,profit,leads:leads.length,won,conv:leads.length?won/leads.length*100:0,avg:os.length?sale/os.length:0}}

/* ---------- alerts (brief §14) ---------- */
function alerts(){
  const a=[];const t=today();
  S.orders.filter(o=>!['Delivered','Closed','Cancelled','Dispatched'].includes(o.status)&&o.dueDate).forEach(o=>{const d=daysTo(o.dueDate);if(d<0)a.push({sev:'bad',mod:'orders',id:o.id,txt:`Order ${o.no} is ${-d} day(s) overdue`});else if(d<=3)a.push({sev:'warn',mod:'orders',id:o.id,txt:`Order ${o.no} due in ${d} day(s)`})});
  S.leads.filter(l=>!['Won','Lost'].includes(l.stage)&&l.nextFollow&&l.nextFollow<=t).forEach(l=>a.push({sev:l.nextFollow<t?'bad':'warn',mod:'crm',id:l.id,txt:`Follow-up ${l.nextFollow<t?'overdue':'due today'}: ${l.name||l.no}`}));
  S.jobs.filter(j=>j.status==='Blocked').forEach(j=>a.push({sev:'bad',mod:'production',id:j.id,txt:`Job ${j.no} is blocked${j.blockReason?' — '+j.blockReason:''}`}));
  S.jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)&&j.plannedEnd&&j.plannedEnd<t).forEach(j=>a.push({sev:'warn',mod:'production',id:j.id,txt:`Job ${j.no} past planned end date`}));
  S.jobs.filter(j=>j.status==='Waiting Material').forEach(j=>a.push({sev:'warn',mod:'production',id:j.id,txt:`Job ${j.no} waiting for material`}));
  S.qc.filter(q=>['Fail','Hold','Rework'].includes(q.result)&&!q.closed).forEach(q=>a.push({sev:'bad',mod:'qc',id:q.id,txt:`QC ${q.result}: ${q.no} (${orderOf(q.order)?.no||''})`}));
  S.qc.filter(q=>q.result==='Pass'&&!q.released).forEach(q=>a.push({sev:'info',mod:'qc',id:q.id,txt:`QC ${q.no} passed — awaiting release`}));
  S.quotes.filter(q=>q.status==='Awaiting Approval').forEach(q=>a.push({sev:'warn',mod:'quotes',id:q.id,txt:`Quotation ${q.no} awaiting approval`}));
  S.quotes.filter(q=>['Sent','Approved'].includes(q.status)&&q.validTill&&daysTo(q.validTill)<=2).forEach(q=>a.push({sev:'warn',mod:'quotes',id:q.id,txt:`Quotation ${q.no} ${daysTo(q.validTill)<0?'expired':'expiring soon'}`}));
  S.vouchers.filter(v=>v.status==='Pending').forEach(v=>a.push({sev:'warn',mod:'inventory',id:v.id,txt:`Stock adjustment ${v.no} awaiting approval`}));
  S.wastage.filter(w=>w.status==='Pending').forEach(w=>a.push({sev:Math.abs(num(w.variance))>0?'bad':'warn',mod:'wastage',id:w.id,txt:`Metal variance ${fw(w.variance)} g fine on ${w.refNo||w.no} — needs approval`}));
  S.challans.filter(c=>c.status!=='Closed'&&c.expectedReturn&&c.expectedReturn<t).forEach(c=>a.push({sev:'warn',mod:'karigars',id:c.id,txt:`Challan ${c.no} return overdue (${nameOf('karigars',c.karigar)})`}));
  stockBalances().filter(b=>b.purity&&b.fine<-0.0005).forEach(b=>a.push({sev:'bad',mod:'inventory',txt:`Negative stock: ${b.category} ${b.purity} (${fw(b.fine)} g fine)`}));
  S.dispatches.filter(d=>d.status==='Prepared').forEach(d=>a.push({sev:'info',mod:'dispatch',id:d.id,txt:`${d.no} packed and ready to dispatch`}));
  return a}

function inputHTML(f,v,attr){
  const a=`${attr} ${f.req?'required':''} ${f.ro?'readonly tabindex="-1"':''}`;
  const t=f.t||'text';
  if(t==='panel')return `<div class="ordsum" ${attr}></div>`;
  if(t==='ta')return `<textarea ${a}>${esc(v)}</textarea>`;
  if(t==='cur'){const code=v||f.d||'USD';return `<div class="curpick" data-curpick><input type="hidden" ${a} value="${esc(code)}">${curBtn(code)}<div class="curmenu">${CURRENCIES.map(([c,name])=>`<div class="curopt ${c===code?'on':''}" data-code="${esc(c)}">${curFlag(c)}<span>${esc(name)}</span></div>`).join('')}</div></div>`}
  if(t==='ccode'){const code=v||f.d||'+1';const sel=PHONE_CODES.find(p=>p[0]===code)||['+1','us','United States'];return `<div class="curpick ccpick" data-curpick><input type="hidden" ${a} value="${esc(code)}">${ccBtn(sel)}<div class="curmenu"><input class="ccsearch" placeholder="Search country or code…" autocomplete="off">${PHONE_CODES.map(([d,iso,name])=>`<div class="curopt ${d===code&&iso===sel[1]?'on':''}" data-code="${esc(d)}" data-flag="${esc(iso)}" data-lbl="${esc(d)}">${flagImg(iso)}<span>${esc(d)}&nbsp;&nbsp;${esc(name)}</span></div>`).join('')}</div></div>`}
  if(t==='sel'||t==='ref'){const ops=optList(f.o);return `<select ${a}><option value="">Select…</option>${ops.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v??'')?'selected':''}>${esc(l)}</option>`).join('')}${v&&!ops.some(([k])=>String(k)===String(v))?`<option value="${esc(v)}" selected>${esc(v)}</option>`:''}</select>`}
  if(t==='file'){const files=Array.isArray(v)?v:[];const one=f.max===1;return `<div class="fileup" data-fileup><input type="hidden" ${a} value="${esc(JSON.stringify(files))}"><div class="fileup-prev">${fileupPrev(files)}</div><button type="button" class="fileup-add" data-accept="${esc(f.accept||'image/*')}" data-max="${f.max||10}" title="${esc(f.btn||'Upload')}"><span class="fup-ic">＋</span><span>${esc(one?(files.length?'Replace':'Screenshot'):'Add photo')}</span></button></div>`}
  if(t==='bool')return `<label style="display:flex;gap:6px;align-items:center;padding-top:6px"><input type="checkbox" ${a} ${v?'checked':''} style="width:auto"> ${esc(f.cl||'Yes')}</label>`;
  if(t==='chk'){const ops=optList(f.o);const vs=v||[];return `<div class="chk" ${a}>${ops.map(([k,l])=>`<label><input type="checkbox" value="${esc(k)}" ${vs.includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div>`}
  const ty=t==='num'?'number" step="any':t==='date'?'date':t==='dt'?'datetime-local':t==='time'?'time':t==='email'?'email':t==='tel'?'tel':'text';
  if(f.list){const lid='dl'+uid();const ops=optList(f.list);return `<input type="${ty}" ${a} value="${esc(v)}" list="${lid}" autocomplete="off"><datalist id="${lid}">${ops.map(([k])=>`<option value="${esc(k)}"></option>`).join('')}</datalist>`}
  return `<input type="${ty}" ${a} value="${esc(v)}">`}

function linesHTML(f,rows){
  rows=rows&&rows.length?rows:[{}];
  return `<div class="tw"><table class="lines" data-lines="${f.k}"><thead><tr>${f.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>lineRow(f,r,i)).join('')}</tbody></table></div><div style="margin-top:6px"><button type="button" class="btn sm" data-addline="${f.k}">+ Add line</button></div>`}
function lineRow(f,r,i){return `<tr data-row>${f.cols.map(c=>c.calc?`<td class="calc" data-calc="${c.k}">${c.fmt?c.fmt(c.calc(r)):fq(c.calc(r))}</td>`:`<td style="min-width:${c.w||90}px">${inputHTML(c,r[c.k],`data-c="${c.k}"`)}</td>`).join('')}<td><button type="button" class="btn sm dng" data-delline title="Remove line">✕</button></td></tr>`}

function readForm(root,fields){
  const v={};
  fields.forEach(f=>{
    if(f.t==='lines'){const tb=root.querySelector(`[data-lines="${f.k}"] tbody`);v[f.k]=[...tb.querySelectorAll('tr[data-row]')].map(tr=>{const r={};f.cols.forEach(c=>{if(c.calc)return;const el=tr.querySelector(`[data-c="${c.k}"]`);if(!el)return;r[c.k]=c.t==='num'?(el.value===''?'':num(el.value)):el.type==='checkbox'?el.checked:el.value});return r}).filter(r=>Object.values(r).some(x=>x!==''&&x!==false&&x!=null));return}
    const el=root.querySelector(`[data-k="${f.k}"]`);if(!el)return;
    if(f.t==='chk')v[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);
    else if(f.t==='bool')v[f.k]=el.checked;
    else if(f.t==='num')v[f.k]=el.value===''?'':num(el.value);
    else if(f.t==='file'){try{v[f.k]=JSON.parse(el.value||'[]')}catch(e){v[f.k]=[]}}
    else v[f.k]=el.value});
  return v}

function modal({title,sub,body,foot,wide,pro,onMount}){
  const root=$('#modalRoot');const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal ${wide?'wide':''} ${pro?'fpro':''}" role="dialog" aria-modal="true"><div class="mh"><div><h2>${esc(title)}</h2>${sub?`<div class="note">${sub}</div>`:''}</div><button class="btn sm x" data-close aria-label="Close">✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
  root.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))close()});
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  onMount&&onMount(ov,close);
  const first=ov.querySelector('input:not([readonly]),select,textarea');first&&first.focus();
  return{ov,close}}

/* openForm: generic create/edit with validation, live calc and save */
function openForm({title,sub,fields,value={},onSave,wide,pro,extra='',onChange,saveLabel}){
  const v=value||{};
  const fieldHTML=f=> f.t==='lines'?`<div class="f w4"><label>${esc(f.l)}</label>${linesHTML(f,v[f.k])}</div>`
    : f.t==='panel'?`<div class="f w4">${inputHTML(f,'',`data-k="${f.k}"`)}</div>`
    : f.t==='hr'?`<div class="f w4"><h3 style="margin:8px 0 0">${esc(f.l)}</h3></div>`
    : `<div class="f ${f.w?'w'+f.w:''}"><label>${esc(f.l)}${f.req?' <span class="rq">*</span>':''}</label>${inputHTML(f,f.calc?f.calc(v):v[f.k]??f.d??'',`data-k="${f.k}"`)}${f.hint?`<span class="note">${esc(f.hint)}</span>`:''}</div>`;
  let body;
  if(pro){
    // group fields into premium section cards, split at each `hr` marker (its label/icon = card header)
    const cards=[];let cur={title:null,icon:'',items:[]};
    const flush=()=>{if(cur.items.length||cur.title!=null)cards.push(cur);cur={title:null,icon:'',items:[]}};
    fields.forEach(f=>{if(f.t==='hr'){flush();cur={title:f.l,icon:f.icon||'',items:[]}}else cur.items.push(f)});
    flush();
    body=`${extra}<form class="form-pro" novalidate>${cards.map(c=>`<section class="fcard">${c.title!=null?`<div class="fcard-h">${c.icon?`<span class="fcard-ic">${c.icon}</span>`:''}<h3>${esc(c.title)}</h3></div>`:''}<div class="form">${c.items.map(fieldHTML).join('')}</div></section>`).join('')}</form>`;
  }else{
    body=`${extra}<form class="form" novalidate>${fields.map(fieldHTML).join('')}</form>`;
  }
  return modal({title,sub,wide,pro,body,foot:`<button class="btn" data-close>${T('Cancel')}</button><button class="btn pri" data-save>${esc(saveLabel||T('Save'))}</button>`,onMount(ov,close){
    const form=ov.querySelector('form');
    const recalc=()=>{const cur={...v,...readForm(form,fields)};
      fields.forEach(f=>{if(f.calc){const el=form.querySelector(`[data-k="${f.k}"]`);if(el)el.value=f.calc(cur)}
        if(f.t==='lines')form.querySelectorAll(`[data-lines="${f.k}"] tbody tr`).forEach((tr,i)=>{const r=cur[f.k][i]||{};f.cols.forEach(c=>{if(c.calc){const td=tr.querySelector(`[data-calc="${c.k}"]`);if(td){const rr={};c&&f.cols.forEach(cc=>{const el=tr.querySelector(`[data-c="${cc.k}"]`);if(el)rr[cc.k]=el.value});td.textContent=c.fmt?c.fmt(c.calc(rr)):fq(c.calc(rr))}}})})});
      onChange&&onChange(cur,form)};
    form.addEventListener('input',recalc);form.addEventListener('change',recalc);
    form.addEventListener('click',e=>{
      const add=e.target.closest('[data-addline]');if(add){const f=fields.find(x=>x.k===add.dataset.addline);const tb=form.querySelector(`[data-lines="${f.k}"] tbody`);tb.insertAdjacentHTML('beforeend',lineRow(f,{},tb.children.length));recalc()}
      const del=e.target.closest('[data-delline]');if(del){del.closest('tr').remove();recalc()}});
    recalc();
    ov.querySelector('[data-save]').addEventListener('click',async ev=>{
      const vals=readForm(form,fields);
      const miss=fields.filter(f=>f.req&&(vals[f.k]===''||vals[f.k]==null||(Array.isArray(vals[f.k])&&!vals[f.k].length)));
      $$('.f',form).forEach(x=>x.style.outline='');
      if(miss.length){miss.forEach(f=>{const el=form.querySelector(`[data-k="${f.k}"]`);el&&(el.closest('.f').style.outline='2px solid var(--bad)')});toast('Fill the required fields: '+miss.map(f=>f.l).join(', '),true);return}
      fields.forEach(f=>{if(f.calc)vals[f.k]=f.calc({...v,...vals})});
      ev.target.disabled=true;
      try{const r=await onSave({...v,...vals});if(r!==false)close()}catch(e){console.error(e)}finally{ev.target.disabled=false}})}})}

/* table helper */
function table(cols,rows,{onClick,empty='Nothing here yet.',emptyHint=''}={}){
  if(!rows.length)return `<div class="tw"><div class="empty"><b>${esc(empty)}</b>${esc(emptyHint)}</div></div>`;
  const id='t'+uid();
  setTimeout(()=>{const t=document.getElementById(id);if(t&&onClick)t.addEventListener('click',e=>{const tr=e.target.closest('tr[data-i]');if(tr&&!e.target.closest('button,a,input,select'))onClick(rows[+tr.dataset.i])})});
  return `<div class="tw"><table id="${id}"><thead><tr>${cols.map(c=>`<th class="${c.n?'num':''}">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-i="${i}" class="${onClick?'click':''}">${cols.map(c=>`<td class="${c.n?'n':''}">${c.h?c.h(r):esc(r[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

$('#gsearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();const box=$('#sres');
  if(q.length<2){box.hidden=true;return}
  const map=[['orders','orders','Order'],['leads','crm','Lead'],['quotes','quotes','Quotation'],['customers','masters','Customer'],['designs','designs','Design'],['jobs','production','Job card'],['karigars','karigars','Karigar'],['challans','karigars','Challan'],['vouchers','inventory','Voucher'],['invoices','accounts','Invoice'],['dispatches','dispatch','Dispatch'],['qc','qc','QC'],['suppliers','masters','Supplier'],['pos','purchase','PO']];
  const hits=[];map.forEach(([c,mod,lab])=>{if(!can(mod))return;S[c].forEach(x=>{const s=[x.no,x.name,x.code,x.phone,x.email,x.tracking,x.lot,custName(x.customer)].join(' ').toLowerCase();if(s.includes(q))hits.push({c,mod,lab,x})})});
  box.innerHTML=hits.slice(0,25).map((h,i)=>`<a href="#${h.mod}" data-h="${i}"><span class="pill">${h.lab}</span><span class="ref">${esc(h.x.no||h.x.code||'')}</span><span>${esc(h.x.name||custName(h.x.customer)||h.x.vtype||'')}</span></a>`).join('')||'<div class="empty">No matches</div>';
  box.hidden=false;
  box.onclick=ev=>{const a=ev.target.closest('[data-h]');if(!a)return;ev.preventDefault();const h=hits[+a.dataset.h];box.hidden=true;e.target.value='';go(h.mod);setTimeout(()=>openRecord(h.c,h.x.id),60)}});

/* ---------- CSV export (brief §15: permission-controlled) ---------- */
async function exportCSV(name,cols,rows){
  if(!can('reports','view')){toast('You do not have export permission.',true);return}
  const csv=[cols.map(c=>c.l).join(','),...rows.map(r=>cols.map(c=>{let v=c.x?c.x(r):r[c.k];v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(','))].join('\n');
  saveFile(`${name}-${today()}.csv`,'\ufeff'+csv,'text/csv');api('/api/log',{coll:'reports',no:name,action:'export csv',reason:rows.length+' rows'}).catch(()=>{})}
const cellVal=(c,r)=>{let v=c.x?c.x(r):r[c.k];return v==null?'':typeof v==='number'?(''+(Math.round(v*1000)/1000)):String(v)};
function exportXLS(name,cols,rows){
  if(!can('reports','view')){toast('You do not have export permission.',true);return}
  const head=`<tr>${cols.map(c=>`<th style="background:#161d26;color:#fff;border:1px solid #999;padding:4px">${esc(c.l)}</th>`).join('')}</tr>`;
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td style="border:1px solid #ccc;padding:4px">${esc(cellVal(c,r))}</td>`).join('')}</tr>`).join('');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><h3>${esc(name)} · ${esc(SET.company.name)} · ${today()}</h3><table border="1">${head}${body}</table></body></html>`;
  saveFile(`${name}-${today()}.xls`,html,'application/vnd.ms-excel');api('/api/log',{coll:'reports',no:name,action:'export excel',reason:rows.length+' rows'}).catch(()=>{})}
function exportPDF(name,cols,rows){
  if(!can('reports','view')){toast('You do not have export permission.',true);return}
  const head=`<tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr>`;
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(cellVal(c,r))}</td>`).join('')}</tr>`).join('');
  const html=`<!doctype html><meta charset="utf-8"><title>${esc(name)}</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#111;font-size:11px}h1{font-size:17px;margin:0}table{border-collapse:collapse;width:100%;margin-top:10px}th,td{border:1px solid #999;padding:4px;text-align:left}th{background:#eee}@media print{button{display:none}}</style><button onclick="print()" style="float:right;padding:8px 14px">Print / Save PDF</button><h1>IVEVAR — ${esc(name)}</h1><div style="color:#555">${esc(SET.company.name)} · ${today()} · ${rows.length} rows</div><table>${head}${body}</table><script>setTimeout(()=>print(),500)</`+`script>`;
  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to export PDF.',true);return}w.document.write(html);w.document.close();api('/api/log',{coll:'reports',no:name,action:'export pdf',reason:rows.length+' rows'}).catch(()=>{})}

}

  const inTransit=S.dispatches.filter(d=>['Dispatched','In Transit'].includes(d.status));

   <div class="card"><h2>Ready to pack / ship <span class="pill ${ready.length?'warn':'good'}">${ready.length}</span></h2>${ready.length?table([{l:'Order',h:r=>`<span class="ref">${esc(r.no)}</span>`},{l:'Customer',h:r=>esc(custName(r.customer))},{l:'Stage',h:r=>stPill(orderStage(r))},{l:'Due',h:r=>fdate(r.dueDate)}],ready,{onClick:orderDetail}):'<div class="empty"><b>Nothing waiting</b></div>'}</div>

  else body=salesReport();

function tabsHTML(key,tabs,cur){return `<div class="tabs">${tabs.map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="TAB['${key}']='${k}';render()">${esc(l)}</button>`).join('')}</div>`}
function salesReport(){
  const bySrc={};S.leads.forEach(l=>{const s=l.source||'—';bySrc[s]=bySrc[s]||{l:s,n:0,won:0,val:0};bySrc[s].n++;if(l.stage==='Won'){bySrc[s].won++;bySrc[s].val+=num(l.budget)}});
  const byEmp={};S.leads.forEach(l=>{const e=nameOf('employees',l.assignedTo)||'Unassigned';byEmp[e]=byEmp[e]||{l:e,n:0,q:0,won:0};byEmp[e].n++;if(['Quotation Sent','Negotiation','Won'].includes(l.stage))byEmp[e].q++;if(l.stage==='Won')byEmp[e].won++});
  const lost={};S.leads.filter(l=>l.stage==='Lost').forEach(l=>{const r=l.lostReason||'Not given';lost[r]=(lost[r]||0)+1});
  const age=S.leads.filter(l=>!['Won','Lost'].includes(l.stage)).map(l=>({l:l.name,v:Math.max(0,-daysTo((l.date||'').slice(0,10)))})).sort((a,b)=>b.v-a.v).slice(0,8);
  return `<div class="grid g2"><div class="card"><h2>Lead source</h2>${table([{l:'Source',k:'l'},{l:'Leads',n:1,k:'n'},{l:'Won',n:1,k:'won'},{l:'Conversion',n:1,h:r=>fq(r.n?r.won/r.n*100:0)+'%'}],Object.values(bySrc))}</div>
  <div class="card"><h2>Team performance</h2>${table([{l:'Employee',k:'l'},{l:'Leads',n:1,k:'n'},{l:'Quoted+',n:1,k:'q'},{l:'Won',n:1,k:'won'},{l:'Conversion',n:1,h:r=>fq(r.n?r.won/r.n*100:0)+'%'}],Object.values(byEmp))}</div>
  <div class="card"><h2>Lost reasons</h2>${Object.keys(lost).length?hbars(Object.entries(lost).map(([l,v])=>({l,v}))):'<div class="empty">No lost leads.</div>'}</div>
  <div class="card"><h2>Oldest open leads (days)</h2>${age.length?hbars(age):'<div class="empty">No open leads.</div>'}</div></div>`}
function findDup(v){const ph=(v.phone||'').replace(/\D/g,'').slice(-10),em=(v.email||'').toLowerCase().trim();
  const m=x=>(ph&&ph.length>=7&&(x.phone||'').replace(/\D/g,'').slice(-10)===ph)||(em&&(x.email||'').toLowerCase().trim()===em);
  return [...S.leads.filter(x=>x.id!==v.id&&m(x)).map(x=>'lead '+x.no+' ('+x.name+')'),...S.customers.filter(x=>m(x)).map(x=>'customer '+x.no+' ('+x.name+')')]}
function leadForm(l){
  let warned='';

/* live pricing summary tiles for the order form — pure display, uses the same formulas as the saved profit sheet */
function orderSummaryHTML(v,isNew){
  const cur=v.currency||'USD';const r=fxRate(cur)||88;
  const saleCur=num(v.saleValue);const makeINR=num(v.makingCostINR),courINR=num(v.courierINR);
  const saleINR=toINRat(saleCur,cur,r);const profitINR=saleINR-makeINR-courINR;
  const toCur=inr=>cur==='INR'?inr:inr/r;                 // INR → order currency for the headline figure
  const inr=x=>'₹ '+fq(r2(x));
  const pct=commPctOf(ME.id);
  const adv=num(v.advance);const bal=saleCur-adv;
  const tile=(l,val,sub,cls)=>`<div class="sumtile ${cls||''}"><span class="st-l">${l}</span><span class="st-v">${val}</span>${sub?`<span class="st-s">${sub}</span>`:''}</div>`;
  let h=tile('Order value',fcur(saleCur,cur),cur!=='INR'?inr(saleINR):'')
       +tile('Making cost',fcur(r2(toCur(makeINR)),cur),inr(makeINR))
       +tile('Courier',fcur(r2(toCur(courINR)),cur),inr(courINR))
       +tile('Profit before mktg',fcur(r2(toCur(profitINR)),cur),inr(profitINR),profitINR<0?'bad':'good');
  if(pct>0)h+=tile('Sales share '+pct+'%',fcur(r2(toCur(profitINR)*pct/100),cur),'','accent');
  if(isNew){h+=tile('Advance now',fcur(adv,cur),'');h+=tile('Balance to collect',fcur(r2(bal),cur),'',bal>0.5?'warn':'good')}
  return h}

/* ============ ATTENDANCE (selfie + GPS + multiple sessions + shift rule) ============ */
const istDate=()=>new Date(Date.now()+330*60000).toISOString().slice(0,10);
const hm=iso=>iso?new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—';
function hoursBetween(a,b){if(!a)return 0;return Math.max(0,((b?new Date(b):new Date())-new Date(a))/36e5)}
const fh=h=>`${Math.floor(h)}h ${String(Math.round((h%1)*60)).padStart(2,'0')}m`;
const sessOf=p=>(p&&Array.isArray(p.sessions))?p.sessions:(p&&p.in?[{in:p.in,out:p.out,report:p.report}]:[]);
function dayHours(p){return sessOf(p).reduce((t,s)=>t+(s.in?hoursBetween(s.in,s.out):0),0)}
function openSess(p){return sessOf(p).some(s=>s.in&&!s.out)}
function getShift(uid){if(uid===ME.id&&ME.shift)return ME.shift;const u=USERS.find(x=>x.id===uid);return (u&&u.shift)||null}
function shiftHours(sh){if(!sh||!sh.start||!sh.end)return 9;const mn=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};let d=mn(sh.end)-mn(sh.start);if(d<=0)d+=1440;return d/60}
/* attendance verdict per the agreed rule: 5-min late or early-leave → half day, but full if total hours met */
function attStatus(p,uid){const sess=sessOf(p).filter(s=>s.in);if(!sess.length)return{code:'—',label:'Not marked'};
  const sh=getShift(uid);const need=shiftHours(sh);const hrs=dayHours(p);
  const lastOut=sess.filter(s=>s.out).slice(-1)[0];
  if(hrs>=need-0.02)return{code:'P',label:'Present',hrs};
  if(openSess(p))return{code:'IN',label:'Checked in',hrs};
  let late=false,early=false;
  if(sh&&sh.start&&sh.end){const mn=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};const overnight=mn(sh.end)<=mn(sh.start);
    const inD=new Date(sess[0].in);const inMin=inD.getHours()*60+inD.getMinutes();
    if(!overnight){late=inMin>mn(sh.start)+5;if(lastOut){const oD=new Date(lastOut.out);const oMin=oD.getHours()*60+oD.getMinutes();early=oMin<mn(sh.end)-5}}}
  if(late||early)return{code:'H',label:'Half day'+(late?' (late in)':'')+(early?' (early out)':''),hrs};
  return{code:'P',label:'Present',hrs}}
function myPunch(){return S.punch.find(p=>p.user===ME.id&&p.date===istDate())}
/* capture a selfie (camera on mobile) then GPS, then punch */
function capturePunch(action,extra){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='user';
  inp.onchange=async()=>{const f=inp.files[0];if(!f){toast('A selfie is required to mark attendance.',true);return}
    toast('Uploading selfie…');let photo=null;try{const r=await uploadFile(f);photo={id:r.id,url:r.url}}catch(e){toast('Could not upload selfie: '+(e.message||''),true);return}
    toast('Getting location…');const coords=await new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:8000})});
    const body={action,photo,...(coords||{}),...(extra||{})};
    try{const r=await api('/api/punch',body);upsert('punch',r.doc);toast(action==='in'?'Checked in '+hm(r.doc.in)+(coords?' 📍':''):'Checked out '+hm(r.doc.out));render()}catch(e){toast(e.message,true)}};

function commissionRows(from){return USERS.filter(u=>u.active!==false&&u.role!=='admin'&&commPctOf(u.id)>0).map(u=>{const st=salesStats(u.id,from);const profit=r2(st.orders.reduce((a,o)=>a+orderProfit(o),0));const share=r2(st.orders.reduce((a,o)=>a+orderCommission(o),0));const mkt=r2(S.cash.filter(e=>e.type==='Expense'&&/market/i.test(e.category||'')&&e.employee===u.id&&(!from||(e.date||'')>=from)).reduce((a,e)=>a+num(e.amount),0));return{id:u.id,name:u.name,orders:st.count,profit,share,marketing:mkt,payable:r2(share-mkt)}}).filter(r=>r.orders||r.profit)}

/* ============ FILE ATTACHMENTS ============ */
const MAX_PHOTOS=15;            // per record (piece / QC / dispatch proof…)
const MAX_FILE_MB=25;
function pickFiles(cb,accept,max){
  const inp=document.createElement('input');inp.type='file';inp.multiple=(max!==1);if(accept)inp.accept=accept;
  inp.onchange=async()=>{let files=[...inp.files];
    if(max!=null&&max<=0){toast('Limit reached — remove some before adding more.',true);return}
    if(max!=null&&files.length>max){toast(`You can add only ${max} more — the first ${max} will be used.`,true);files=files.slice(0,max)}
    const out=[];for(const f of files){
      if(f.size>MAX_FILE_MB*1024*1024){toast(f.name+' is larger than '+MAX_FILE_MB+' MB — skipped.',true);continue}
      try{toast('Uploading '+f.name+'…');const r=await uploadFile(f);out.push({id:r.id,url:r.url,name:f.name,type:r.type||f.type})}catch(e){toast('Could not upload '+f.name+': '+(e.message||e.code),true)}}
    if(out.length)cb(out)};inp.click()}
function filesHTML(arr){if(!arr||!arr.length)return '<span class="note">No files.</span>';
  return `<div class="files">${arr.map(f=>(f.type||'').startsWith('image/')?`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.name)}">${esc(f.name)}</a>`:`<a href="${esc(f.url)}" target="_blank" rel="noopener"><div style="width:110px;height:84px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-family:var(--f-num)">${esc((f.name.split('.').pop()||'FILE').toUpperCase())}</div>${esc(f.name)}</a>`).join('')}</div>`}

  return phead('Wastage & Recovery','Expected loss, measured difference and recovered scrap are kept separate. Unexplained differences are never closed as wastage automatically.',can('wastage','edit')?btn('+ Process loss record','onclick="wastageForm()"','pri'):'')+
  `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi ${pend.length?'alert':''}"><span class="v">${pend.length}</span><span class="l">Awaiting approval</span></div><div class="card kpi"><span class="v">${fw(pend.reduce((a,w)=>a+num(w.variance),0))}</span><span class="l">Pending variance (g fine)</span></div><div class="card kpi gold"><span class="v">${fw(tot('Approved'))}</span><span class="l">Approved wastage (g fine)</span></div><div class="card kpi"><span class="v">${fw(S.wastage.reduce((a,w)=>a+num(w.recovered),0))}</span><span class="l">Recovered in scrap (g fine)</span></div></div>`+
  filterBar('wastage',['Pending','Approved','Rejected'])+table([{l:'No.',h:r=>`<span class="ref">${esc(r.no)}</span>`},{l:'Date',h:r=>fdate(r.date)},{l:'Source',k:'source'},{l:'Ref',k:'refNo'},{l:'Karigar / dept',h:r=>esc(nameOf('karigars',r.karigar)||r.dept||'')},{l:'Issued fine',n:1,h:r=>fw(r.issuedFine)},{l:'Accounted',n:1,h:r=>fw(r.accountedFine)},{l:'Variance',n:1,h:r=>`<b>${fw(r.variance)}</b>`},{l:'Expected loss',n:1,h:r=>fw(num(r.issuedFine)*num(r.expectedPct)/100)},{l:'Status',h:r=>stPill(r.status)}],applyFil('wastage',S.wastage).sort((a,b)=>(b.no||'').localeCompare(a.no||'')),{onClick:wastageForm,empty:'No variance records',emptyHint:'Records appear automatically when a karigar challan or job closes with a metal difference.'})}

     foot:w.status==='Pending'?[can('wastage','edit')?btn('Add explanation','data-x'):'',can('wastage','edit')?btn('+ Evidence','data-f'):'',can('wastage','approve')?btn('Reject → recover from responsible','data-rj','dng')+btn('Approve as wastage','data-ap','good'):''].join(''):'',

      b('[data-f]')&&(b('[data-f]').onclick=()=>pickFiles(async f=>{close();const s=await save('wastage',{...w,files:[...(w.files||[]),...f]},{action:'evidence'});wastageForm(s)}));

      b('[data-rj]')&&(b('[data-rj]').onclick=()=>{close();askReason('Reject wastage','How will the metal be recovered?',r=>save('wastage',{...w,status:'Rejected',decidedBy:ME.id,decision:r},{action:'reject',reason:r}))})}});return}

   onSave:v=>save('wastage',{...v,variance:r3(num(v.issuedFine)-num(v.accountedFine)-num(v.recovered)),status:'Pending'})})}

  table([{l:'QC',h:r=>`<span class="ref">${esc(r.no)}</span>`},{l:'Date',h:r=>fdate(r.date)},{l:'Order · item',h:r=>{const o=orderOf(r.order);return esc((o?.no||'')+' · #'+(num(r.line)+1)+' '+(o?.lines?.[r.line]?.desc||''))}},{l:'Job',h:r=>esc(byId('jobs',r.job)?.no||'')},{l:'Result',h:r=>stPill(r.result)},{l:'Defect',k:'defect'},{l:'Inspector',h:r=>esc(userName(r.inspector))},{l:'Released',h:r=>r.released?'<span class="pill good">Released</span>':''}],rows.sort((a,b)=>(b.no||'').localeCompare(a.no||'')),{onClick:qcForm,empty:tab==='open'?'No failed or held items':'Nothing here'})}

   {k:'result',l:'Result',t:'sel',o:['Pass','Fail','Hold','Rework'],req:1},{k:'defect',l:'Defect code',t:'sel',o:()=>SET.defects},{k:'dept',l:'Responsible dept / vendor',t:'sel',o:()=>SET.departments},{k:'notes',l:'Notes',t:'ta',w:4}],

async function setLineStatus(orderId,idx,st){const o=orderOf(orderId);if(!o)return;const lines=JSON.parse(JSON.stringify(o.lines||[]));if(!lines[idx]||lines[idx].status===st)return;lines[idx].status=st;

  const tab=TAB.dsp||'ready';
  return phead('Packing & Dispatch','Only QC-released items can be packed. Dispatch needs an invoice and tracking number. Partial dispatch is supported.','')+tabsHTML('dsp',[['ready',`Ready to pack (${ready.length})`],['list','Dispatches']],tab)+
  (tab==='ready'?table([{l:'Order',h:r=>`<span class="ref">${esc(r.o.no)}</span>`},{l:'Customer',h:r=>esc(custName(r.o.customer))},{l:'Item',h:r=>'#'+(r.i+1)+' '+esc(r.l.desc||'')},{l:'Qty left',n:1,h:r=>fq(r.rem)},{l:'Due',h:r=>fdate(r.o.dueDate)},{l:'',h:r=>can('dispatch','edit')?`<button class="btn sm pri" onclick="dispatchForm({order:'${r.o.id}',date:today(),status:'Prepared'})">Pack</button>`:''}],ready,{empty:'Nothing ready',emptyHint:'Items appear here after QC release.'})

  else{const months=[...new Set(S.cash.map(e=>(e.date||'').slice(0,7)).filter(Boolean))].sort().reverse().slice(0,12);
    body=table([{l:'Month',k:'m'},{l:'Money in',n:1,h:r=>`<span style="color:var(--good)">${money(r.i)}</span>`},{l:'Money out',n:1,h:r=>`<span style="color:var(--bad)">${money(r.o)}</span>`},{l:'Net',n:1,h:r=>`<b style="color:${r.i-r.o<0?'var(--bad)':'var(--good)'}">${money(r.i-r.o)}</b>`}],months.map(m=>{const x=S.cash.filter(e=>(e.date||'').startsWith(m));return{m,i:x.filter(e=>e.type==='Income'&&e.category!=='Opening balance').reduce((t,e)=>t+num(e.amount),0),o:x.filter(e=>e.type==='Expense').reduce((t,e)=>t+num(e.amount),0)}}),{empty:'No entries yet'})+`<div class="note" style="margin-top:8px">Opening balance entries are not counted as income here.</div>`}

let CHAT_CH='office',CHAT_OPEN=false;

function dmId(other){return 'dm:'+[ME.id,other].sort().join('|')}
function chMsgs(ch){return S.messages.filter(m=>m.channel===ch).sort((a,b)=>(a.at||'').localeCompare(b.at||''))}
function chLastRead(ch){try{return localStorage.getItem('chatrd_'+ch)||''}catch(e){return ''}}
function chMarkRead(ch){try{const ms=chMsgs(ch);localStorage.setItem('chatrd_'+ch,ms.length?ms[ms.length-1].at:nowISO())}catch(e){}}
function chUnread(ch){const rd=chLastRead(ch);return chMsgs(ch).filter(m=>m.from!==ME.id&&(m.at||'')>rd).length}
function chatUnread(){let n=chUnread('office');USERS.forEach(u=>{if(u.id!==ME.id&&u.active!==false)n+=chUnread(dmId(u.id))});return n}
function chName(ch){if(ch==='office')return 'Office group';const o=ch.slice(3).split('|').find(x=>x!==ME.id);return userName(o)}
function chLast(ch){const ms=chMsgs(ch);const m=ms[ms.length-1];return m?{txt:(m.from===ME.id?'You: ':'')+(m.text||'📷 Photo'),at:m.at}:null}
function fchatT(at){if(!at)return '';const d=new Date(at),t=new Date();return d.toDateString()===t.toDateString()?d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}

function msgBubble(m){const mine=m.from===ME.id;const reacts=m.reactions||{};const rk=Object.keys(reacts).filter(k=>reacts[k]&&reacts[k].length);
  return `<div class="msg ${mine?'me':''}">${!mine&&CHAT_CH==='office'?`<div class="mfrom" style="color:${avtColor(m.from)}">${esc(userName(m.from))}</div>`:''}<div class="bubwrap"><div class="bub">${esc(m.text||'')}<span class="mt">${fchatT(m.at)}</span></div><span class="rxadd" onclick="this.parentNode.querySelector('.rxpick').classList.toggle('show')">☺</span><span class="rxpick">${['👍','❤️','😂','🎉','🙏','✅'].map(e=>`<span onclick="chReact('${m.id}','${e}')">${e}</span>`).join('')}</span></div>${rk.length?`<div class="mreact">${rk.map(k=>`<span class="rx ${reacts[k].includes(ME.id)?'on':''}" onclick="chReact('${m.id}','${k}')">${k} ${reacts[k].length}</span>`).join('')}</div>`:''}</div>`}

   <div class="chthread" id="chThread">${ms.length?ms.map(msgBubble).join(''):'<div class="empty" style="margin:auto"><b>No messages yet</b>Say hello 👋</div>'}</div>

    <div class="setrow"><div><b>Pop-up notifications</b><div class="note">Get an alert when the app is in the background</div></div>${push==='Allow'?`<button class="btn pri" onclick="askPush()">Allow</button>`:`<span class="pill ${push==='On'?'good':'warn'}">${push}</span>`}</div>
   </div>
   <div class="card setcard"><div class="cap2">${ic('chat')} Chat &amp; media</div>
    <div class="setrow"><div><b>Save photos, videos &amp; voice notes</b><div class="note">Tap ⬇ Save under any photo, video or voice message in a chat to download it to your device.</div></div></div>
    <div class="setrow link" onclick="go('chat')"><div><b>Open chat</b><div class="note">Team &amp; customer messages</div></div><span class="chev">›</span></div>
   </div>
   ${admin?`<div class="card setcard"><div class="cap2">${ic('building')} Office</div>
    <div class="setrow link" onclick="companyForm()"><div><b>Company profile</b><div class="note">Name &amp; address on order slips, commission %</div></div><span class="chev">›</span></div>
    <div class="setrow link" onclick="fxForm()"><div><b>${ic('swap')} Currency rates</b><div class="note">Set USD, AUD, GBP… → ₹ (locked onto each new order)</div></div><span class="chev">›</span></div>
    <div class="setrow link" onclick="jewelRatesForm()"><div><b>${ic('gem')} Jewellery rates</b><div class="note">Gold / silver / platinum / diamond rates + labour for the quotation price calculator</div></div><span class="chev">›</span></div>
    <div class="setrow link" onclick="go('setup')"><div><b>Staff &amp; users</b><div class="note">Add team members and set their permissions</div></div><span class="chev">›</span></div>
   </div>`:''}
   <div class="card setcard"><div class="cap2">${ic('user')} Account</div>
    <div class="setrow"><div><b>${esc(ME.name)}</b><div class="note">${esc(ME.email)} · ${esc(roleLabel(ME))}</div></div></div>
    <div class="setrow link" onclick="pwForm()"><div><b>Change password</b></div><span class="chev">›</span></div>
    <div class="setrow link" onclick="logout()"><div><b>Sign out</b><div class="note">Log out of this account</div></div><span class="chev">›</span></div>
   </div>
   <div class="card setcard"><div class="cap2">${ic('smartphone')} App</div>
    <div class="setrow"><div><b>Refresh app</b><div class="note">Load the latest version</div></div><button class="btn" onclick="location.reload(true)">Refresh</button></div>
    <div class="setrow"><div><b>About</b><div class="note">Ivevar Management office software By Ivevar Jewel LLP</div></div></div>
   </div>
   <div class="sethint">Like an app on your phone: browser menu → “Add to Home screen”</div>
   <div class="card setcard"><div class="cap2">${ic('lifebuoy')} Contact / support</div>
    <div class="setrow setcontact"><div><b>${esc(c.name||'')}</b><div class="note">${esc(c.address||'')}</div></div>
     <div class="cbtns">${c.phone?`<a class="btn" href="tel:${esc(c.phone.replace(/\s/g,''))}">${ic('phone')} Call</a>`:''}${digits?`<a class="btn" href="https://wa.me/${digits}" target="_blank" rel="noopener">WhatsApp</a>`:''}${c.email?`<a class="btn" href="mailto:${esc(c.email)}">✉️ Email</a>`:''}<a class="btn" href="${esc(site)}" target="_blank" rel="noopener">🌐 Website</a></div>
    </div>
   </div>
  </div>`}
function companyForm(){const c=SET.company||{};const fx=SET.fxRates||{};const FXC=['USD','AUD','GBP','EUR','CAD','AED','SGD','NZD'];
  const fxFields=FXC.map(cc=>({k:'fx_'+cc,l:cc+' → ₹',t:'num'}));const fxVals={};FXC.forEach(cc=>fxVals['fx_'+cc]=num(fx[cc])||'');
  openForm({title:'Company profile',wide:1,fields:[
  {k:'name',l:'Company name (on order slips)',req:1,w:2},
  {k:'address',l:'Address',t:'ta',w:2},
  {k:'phone',l:'Phone / WhatsApp'},
  {k:'email',l:'Email',t:'email'},
  {k:'website',l:'Website'},
  {k:'commissionPct',l:'Sales commission %',t:'num',d:25},
  {k:'fxHr',l:'Currency → INR rates — you fix these; each new order locks the rate for its currency',t:'hr'},
  ...fxFields
],value:{name:c.name||'',address:c.address||'',phone:c.phone||'',email:c.email||'',website:SET.website||'https://ivevar.com',commissionPct:SET.commissionPct||25,...fxVals},async onSave(v){
  const company={...SET.company,name:(v.name||'').trim(),address:(v.address||'').trim(),phone:(v.phone||'').trim(),email:(v.email||'').trim()};
  const fxRates={...(SET.fxRates||{}),INR:1};FXC.forEach(cc=>{if(num(v['fx_'+cc]))fxRates[cc]=num(v['fx_'+cc])});
  await saveSettings({company,website:(v.website||'').trim(),usdInr:num(v['fx_USD'])||num(SET.usdInr)||88,commissionPct:num(v.commissionPct)||25,fxRates},'company profile');
}})}
function fxForm(){const fx=SET.fxRates||{};const FXC=['USD','AUD','GBP','EUR','CAD','AED','SGD','NZD','CHF','JPY','HKD','ZAR','SAR'];
  openForm({title:'Currency → INR rates',sub:'You set these. Each new order automatically locks the rate for its currency.',wide:1,
   fields:FXC.map(cc=>({k:'fx_'+cc,l:cc+' → ₹',t:'num'})),
   value:Object.fromEntries(FXC.map(cc=>['fx_'+cc,num(fx[cc])||''])),
   async onSave(v){const fxRates={...(SET.fxRates||{}),INR:1};FXC.forEach(cc=>{if(num(v['fx_'+cc]))fxRates[cc]=num(v['fx_'+cc])});await saveSettings({fxRates,usdInr:num(v['fx_USD'])||num(SET.usdInr)||88},'currency rates')}})}
function jewelRatesForm(){const j=JW();
  openForm({title:'Jewellery rates (price calculator)',sub:'All in ₹ unless noted. Used to auto-price quotations across every metal.',wide:1,pro:1,value:j,fields:[
   {k:'hrM',l:'Metal & dollar',t:'hr',icon:ic('coin')},
   {k:'dollar',l:'USD → ₹ (dollar rate)',t:'num'},{k:'gold24',l:'24K Gold / gram (₹)',t:'num'},{k:'silver',l:'Silver / gram (₹)',t:'num'},{k:'platinum',l:'Platinum / gram (₹)',t:'num'},
   {k:'goldLabor',l:'Gold labour / gram (₹)',t:'num'},{k:'platLabor',l:'Platinum labour / gram (₹)',t:'num'},{k:'shipping',l:'Shipping & box (₹)',t:'num'},{k:'profit',l:'Default profit %',t:'num'},
   {k:'hrL',l:'Lab-grown diamond',t:'hr',icon:ic('gem')},
   {k:'labMain',l:'Main diamond rate (₹)',t:'num'},{k:'labSide',l:'Side diamond rate (₹)',t:'num'},{k:'labCompare',l:'Compare-at markup %',t:'num'},
   {k:'hrMo',l:'Moissanite',t:'hr',icon:ic('gem')},
   {k:'moisMain',l:'Main stone rate (₹)',t:'num'},{k:'moisSide',l:'Side stone rate (₹)',t:'num'},{k:'moisCompare',l:'Compare-at markup %',t:'num'}],
   async onSave(v){const jewel={};Object.keys(JW()).forEach(k=>{jewel[k]=num(v[k])});await saveSettings({jewel},'jewellery rates')}})}
function setTheme(t){PREF.set('theme',t);applyPrefs();render()}
function setSizePref(s){PREF.set('size',s);applyPrefs();render()}
function askPush(){if(!('Notification'in window)){toast('Notifications are not supported here.',true);return}Notification.requestPermission().then(p=>{toast(p==='granted'?'Notifications turned on ✓':'Not allowed');render()})}

/* ============ RENDER & BOOT ============ */
const VIEWS={dashboard:viewDashboard,chat:viewChat,prefs:viewSettings,crm:viewCRM,quotes:viewQuotes,orders:viewOrders,designs:viewDesigns,purchase:viewPurchase,inventory:viewInventory,production:viewProduction,karigars:viewKarigars,wastage:viewWastage,qc:viewQC,dispatch:viewDispatch,accounts:viewAccounts,hr:viewHR,reports:viewReports,masters:viewMasters,setup:viewSetup,audit:viewAudit};
function render(){
  if(!TOKEN){renderLogin();return}
  if(!LOADED){return}
  $('#app').hidden=false;$('#loginRoot').hidden=true;
  renderNav();
  $('#who').innerHTML='';
  if(!VIEWS[ROUTE])ROUTE='dashboard';
  if(!can(ROUTE)){const first=MODS.find(m=>can(m[0]));$('#view').innerHTML=first?`<div class="empty"><b>No access to this module</b>Ask an admin if you need it.</div>`:`<div class="empty"><b>No modules assigned</b>Ask an admin to set your role.</div>`;return}
  const y=window.scrollY;$('#view').innerHTML=VIEWS[ROUTE]();window.scrollTo(0,y);if(ROUTE==='chat')setTimeout(scrollChatBottom,30)}
function renderLogin(setup){
  $('#app').hidden=true;const L=$('#loginRoot');L.hidden=false;
  L.innerHTML=`<div class="loginwrap"><div class="loginbox"><div class="loginbrand" style="flex-direction:column;gap:4px"><img class="loginlogo" src="${LOGO}" alt="Ivevar Luxury"><div class="brandsub">Office Management</div></div>
   <div class="note" style="margin:4px 0 16px">${setup?'First-time setup — create the owner (Super Admin) account.':'Sign in with your email and password.'}</div>
   <form id="lf" class="form" style="grid-template-columns:1fr;gap:12px">${setup?'<div class="f"><label>Your name</label><input id="lName" required autocomplete="name" placeholder="e.g. Ankit Koshiya"></div>':''}
   <div class="f"><label>Email (your login ID)</label><input id="lEmail" type="email" required autocomplete="username" placeholder="you@ivevar.com"></div>
   <div class="f"><label>Password ${setup?'(min 8 characters)':''}</label><input id="lPw" type="password" required autocomplete="${setup?'new-password':'current-password'}" placeholder="••••••••"></div>
   <button class="btn pri" type="submit" style="width:100%;padding:12px;font-size:15px">${setup?'Create owner account':'Sign in'}</button>
   <div class="note" id="lErr" style="color:var(--bad)"></div></form>
   <div class="loginfoot">Forgot your password? Ask your admin to reset it.</div></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#lErr').textContent='';
    try{const j=await api(setup?'/api/setup':'/api/login',{name:setup?$('#lName').value:undefined,email:$('#lEmail').value.trim(),password:$('#lPw').value},{noAuthRedirect:true});TOKEN=j.token;try{localStorage.setItem('erp_token',TOKEN)}catch(x){}Object.assign(ME,j.user);SINCE=0;LOADED=false;await sync();render()}
    catch(x){$('#lErr').textContent=x.message}}}
async function logout(expired){try{if(!expired&&TOKEN)await api('/api/logout',{},{noAuthRedirect:true})}catch(e){}TOKEN=null;try{localStorage.removeItem('erp_token')}catch(e){}COLLS.forEach(c=>S[c]=[]);LOADED=false;SINCE=0;renderLogin()}
function pwForm(){openForm({title:'Change your password',fields:[{k:'old',l:'Current password',req:1,w:4},{k:'pw',l:'New password (min 8)',req:1,w:4}],value:{},async onSave(v){if(v.pw.length<8){toast('At least 8 characters.',true);return false}try{await api('/api/password',{old:v.old,password:v.pw});toast('Password changed')}catch(e){toast(e.message,true);return false}}})}
try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{})}}catch(e){}
(async function boot(){
  ROUTE=(location.hash||'#dashboard').slice(1)||'dashboard';
  $('#langSel').value=LANG;
  if(!TOKEN){try{const s=await api('/api/status',null,{noAuthRedirect:true});renderLogin(s.needsSetup)}catch(e){renderLogin();$('#lErr')&&($('#lErr').textContent=e.message)}return}
  await sync();if(LOADED)render();else logout(true)})();

async function showHook(){try{const r=await api('/api/shopify/hook');$('#hookBox').innerHTML=`<code>${esc(r.url)}</code><div>Keep this address private.</div>`}catch(e){toast(e.message,true)}}
function saveIntegrations(){const ig={...(SET.integrations||{})};$$('[data-ig]').forEach(i=>ig[i.dataset.ig]=i.value.trim());saveSettings({integrations:ig},'integration settings')}

</script></body></html>
