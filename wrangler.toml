name = "ivevar-management"
main = "dist/worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Workers AI (binding name: AI)
[ai]
binding = "AI"

# D1 database — holds all app data (binding name: DB)
[[d1_databases]]
binding = "DB"
database_name = "ivevar-office-db"
database_id = "48393769-634c-40ac-9a12-682ce925e2f8"

# R2 bucket — uploads / product photos (binding name: FILES)
[[r2_buckets]]
binding = "FILES"
bucket_name = "ivevar-files"
