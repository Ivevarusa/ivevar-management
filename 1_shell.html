<title>Ivevar Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap">
<style>
/* Layout: fixed graphite rail of 18 modules + work surface; gold is used only for primary actions and fine-metal figures */
:root{
  --bg:#f8f3ea; --surface:#fffdf9; --surface2:#f6f0e6; --ink:#1b2033; --muted:#6b6a72; --line:#ece3d4;
  --accent:#e8820c; --accent-soft:#fdeedb; --accent-ink:#ffffff; --navy:#151b3d; --navy2:#232c57;
  --rail:#141a3a; --rail2:#1b2350; --rail-ink:#d7dbef; --rail-active:#e8820c; --rail-brand:#ffb44d;
  --good:#1d7447; --good-soft:#e2f3ea; --warn:#a35f00; --warn-soft:#fbefdc; --bad:#b0281f; --bad-soft:#fbe5e3; --info:#2458a6; --info-soft:#e4ecf8;
  --pri:var(--accent); --pri-ink:var(--accent-ink);
  --f-ui:"Inter","Instrument Sans","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%;background:linear-gradient(90deg,var(--rail2) 0 232px,transparent 232px)}
.rail{background:linear-gradient(180deg,var(--rail) 0%,var(--rail2) 100%);color:var(--rail-ink);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{padding:20px 18px 16px;border-bottom:1px solid #ffffff14}
.brand b{display:block;color:var(--rail-brand);font-size:19px;letter-spacing:.01em}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-brand);opacity:.85;font-weight:600}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav a.gtop{margin-top:6px}
.railfoot{margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff14;display:flex;flex-direction:column;gap:9px}
.rf-user b{color:#fff;font-size:13.5px;display:block;line-height:1.2}
.rf-sub{font-size:11px;color:var(--rail-ink);opacity:.72;margin-top:3px}
.rf-lang{width:100%;padding:7px 10px;border-radius:9px;background:#fff;color:#1a2240;border:1px solid #ffffff22;font-size:12.5px;cursor:pointer}
.rf-lang option{color:#1a2240;background:#fff}
.rf-links{font-size:12px;color:var(--rail-ink);opacity:.9}
.rf-links a{color:var(--rail-brand);cursor:pointer;text-decoration:none}
.rf-links a:hover{text-decoration:underline}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--rail-ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px #0005}
.nav a .ct{margin-left:auto;font-family:var(--f-num);font-size:11px;background:var(--surface2);border-radius:9px;padding:0 6px}
.nav a .ct.hot{background:var(--bad);color:#fff}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav a.on svg{opacity:1}
.navic{display:inline-flex;align-items:center;justify-content:center}
svg.icn{width:18px;height:18px}
.cap svg.icn{width:17px;height:17px;color:var(--accent);flex:none}
h2 svg.icn,h3 svg.icn{width:18px;height:18px;vertical-align:-3px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.menuBtn{display:none}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.sres{position:absolute;top:110%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px #0003;max-height:60vh;overflow:auto;z-index:20}
.sres a{display:flex;gap:8px;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--surface2)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}
.content{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:none;width:100%}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.phead .sub{color:var(--muted);font-size:13px;flex-basis:100%;margin-top:-6px}
.phead .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.dng{color:var(--bad)}
.btn.good{color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #6b4a1a0d;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:500}
.kpi{background:var(--surface2)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.kpi.gold .v{color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.num,td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ref{font-family:var(--f-num);font-size:12.5px;color:var(--info);white-space:nowrap}
.fine{color:var(--accent);font-weight:500}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.gold{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tools input,.tools select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.col h4{margin:2px 4px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;font-size:13px}
.tile:hover{border-color:var(--accent)}
.tile .meta{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.tile.over{box-shadow:inset 3px 0 0 var(--bad)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);font-size:13px;cursor:pointer}
.alert .sev{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{padding:0 0 10px 14px;position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline small{color:var(--muted);display:block}
.route{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.route span{font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.route span.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.route span.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:#0a0e1399;z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:min(920px,100%);box-shadow:0 20px 60px #0006;display:flex;flex-direction:column}
.modal.wide{width:min(1180px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0}
.mh .x{margin-left:auto}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
/* ============ premium sectioned form (Create Order) — scoped to .fpro, leaves every other form untouched ============ */
.modal.fpro{width:min(1080px,100%)}
.modal.fpro .mh{padding:16px 22px;background:var(--surface)}
.modal.fpro .mh h2{font-size:18px}
.modal.fpro .mb{padding:0;background:var(--bg)}
.form-pro{display:flex;flex-direction:column;gap:16px;padding:18px 20px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;box-shadow:0 1px 3px #0000000d}
.fcard-h{display:flex;align-items:center;gap:11px;margin:0 0 15px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.fcard-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);font-size:16px;flex:none;color:var(--accent)}
.fcard-ic svg{width:18px;height:18px}
.fcard-h h3{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em;color:var(--ink)}
.fpro .f{gap:5px}
.fpro .f label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.fpro .f input,.fpro .f select,.fpro .f textarea{padding:0 12px;height:43px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.fpro .f textarea{height:auto;min-height:80px;padding:11px 12px;line-height:1.5}
.fpro .f select{cursor:pointer}
.fpro .f input:hover:not([readonly]),.fpro .f select:hover{border-color:var(--muted)}
.fpro .f input:focus,.fpro .f select:focus,.fpro .f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fpro .f input[readonly]{background:var(--surface2);border-style:solid;border-color:var(--line);color:var(--accent);font-family:var(--f-num);box-shadow:none}
.fpro .curbtn,.fpro .fileup{min-height:43px}
.fpro .curbtn{height:43px;border-radius:10px}
.fpro .curbtn:hover{border-color:var(--muted)}
.fpro .lines input,.fpro .lines select{height:36px;border-radius:8px;background:var(--surface)}
/* live pricing summary tiles */
.ordsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;width:100%}
.sumtile{display:flex;flex-direction:column;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.sumtile .st-l{font-size:10.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.sumtile .st-v{font-size:19px;font-weight:700;font-family:var(--f-num);line-height:1.2;color:var(--ink)}
.sumtile .st-s{font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.sumtile.good{background:var(--good-soft);border-color:#cfe8da}.sumtile.good .st-v{color:var(--good)}
.sumtile.bad{background:var(--bad-soft);border-color:#f0cfcc}.sumtile.bad .st-v{color:var(--bad)}
.sumtile.warn{background:var(--warn-soft);border-color:#eeddbb}.sumtile.warn .st-v{color:var(--warn)}
.sumtile.accent{background:var(--accent-soft);border-color:#f6d9b6}.sumtile.accent .st-v{color:var(--accent)}
/* file-upload remove control + bigger tiles in pro form */
.fprev{position:relative;display:inline-block}
.fileup-rm{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--bad);color:#fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0005;padding:0}
.fileup-rm:hover{filter:brightness(1.12)}
.fpro .fileup-prev img,.fpro .fileup-add{width:88px;height:88px}
.fpro .fileup-add{border-radius:12px}
/* sticky action footer */
.modal.fpro .mf{position:sticky;bottom:0;background:var(--surface);box-shadow:0 -2px 10px #0000000f}
.modal.fpro .mf .btn{padding:9px 16px;font-size:13.5px}
.modal.fpro .mf .btn.pri{padding:9px 24px}
@media(max-width:1100px){.ordsum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
  .ov:has(.modal.fpro){padding:0}
  .modal.fpro{width:100%;min-height:100%;border-radius:0}
  .form-pro{padding:12px;gap:13px}
  .fcard{padding:15px 15px 17px;border-radius:12px}
  .ordsum{grid-template-columns:1fr 1fr}
  .modal.fpro .mf{padding:12px 15px}
}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.f label .rq{color:var(--bad)}
.f input,.f select,.f textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);width:100%;min-width:0}
.f input[readonly]{background:transparent;border-style:dashed;color:var(--accent);font-family:var(--f-num)}
.f textarea{min-height:64px;resize:vertical}
.lines td{padding:4px}
.lines input,.lines select{width:100%;min-width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2)}
.lines td.calc{font-family:var(--f-num);text-align:right;color:var(--accent);white-space:nowrap;padding-top:9px}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbars .r{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.hbars .r .num{font-size:12px}
.perm select{padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);font-size:12px}
.att button{width:30px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);cursor:pointer;font-family:var(--f-num);font-size:12px}
.att button.P{background:var(--good-soft);color:var(--good);border-color:transparent;font-weight:600}
.att button.A{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.att button.H{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.att button.L{background:var(--info-soft);color:var(--info);border-color:transparent;font-weight:600}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;padding:8px 0}
.chk label{white-space:nowrap;justify-content:flex-start}
.chk input,.f .chk input{width:auto!important;flex:none;margin:0}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.files a,.files div{display:flex;flex-direction:column;gap:4px;width:110px;font-size:11.5px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.files img{width:110px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.inout{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:1fr 1fr auto;gap:12px 24px;align-items:center;min-height:150px}
.inout .d{grid-column:1/-1;font-size:13px;opacity:.85;font-weight:600}
.inout .lbl{font-size:12.5px;opacity:.8}
.inout .tm{font-family:var(--f-num);font-size:32px;font-weight:600;letter-spacing:.02em}
.inout .st{font-size:13px;opacity:.85;margin-top:4px}
.inout .pbtn{border:1px solid #ffffff40;background:#ffffff14;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border-radius:10px;cursor:pointer}
.inout .pbtn:hover{background:#ffffff26}
.inout .pbtn.go{background:#22a565;border-color:#22a565}
@media (max-width:640px){.inout{grid-template-columns:1fr 1fr}.inout .pbtn{grid-column:1/-1}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer}
.tile2 .v{font-size:26px;font-weight:700;font-family:var(--f-ui)}
.tile2 .l{font-size:13px;color:var(--muted)}

.chsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px}

.cli{flex:1;min-width:0}

.clt{font-size:11px;color:var(--muted);flex:none}

.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:72%;margin-bottom:6px}
.msg.me{align-self:flex-end;align-items:flex-end}

.mt{font-size:10px;opacity:.6;margin-left:8px;float:right;position:relative;top:4px}

/* ======== THEMES (Settings → Appearance) ======== */
/* Luxury Ivory — the recommended default: ivory surfaces, deep-ink headings, champagne accent, dark-ink primary buttons, deep-ink sidebar */
:root[data-theme="ivory"]{--bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede7;--ink:#18242c;--muted:#657078;--line:#ddd5c9;--accent:#b08a4a;--accent-soft:#f2ebdc;--accent-ink:#ffffff;--pri:#18242c;--pri-ink:#ffffff;--navy:#18242c;--navy2:#26343d;--rail:#141d24;--rail2:#202d37;--rail-ink:#c8cfd4;--rail-active:#b08a4a;--rail-brand:#cba96a;--good:#276a57;--good-soft:#e3efea;--warn:#a76420;--warn-soft:#f6ead9;--bad:#b54747;--bad-soft:#f6e6e6;--info:#315e8a;--info-soft:#e4ebf3}
/* Midnight Luxury — refined dark slate + champagne gold */
:root[data-theme="midnight"]{--bg:#0e151b;--surface:#17222b;--surface2:#202d37;--ink:#f3f2ee;--muted:#b6c0c7;--line:#34434e;--accent:#d5b478;--accent-soft:#2e2a1e;--accent-ink:#1a1206;--pri:#d5b478;--pri-ink:#17120a;--navy:#0a0e16;--navy2:#141b2b;--rail:#0b1218;--rail2:#141f28;--rail-ink:#c6d0d7;--rail-brand:#d5b478;--good:#37c489;--good-soft:#123024;--warn:#e0a84a;--warn-soft:#352a14;--bad:#f0685e;--bad-soft:#3a1c1a;--info:#6aa6ff;--info-soft:#17233a}

:root[data-theme="royal"]{--bg:#15111f;--surface:#1f1830;--surface2:#271e3b;--ink:#efeafb;--muted:#a99fc0;--line:#352a4d;--accent:#e0b84a;--accent-soft:#33280f;--accent-ink:#1a1206;--navy:#120d1d;--navy2:#241a38;--rail:#120c1f;--rail2:#241834;--rail-ink:#d8cfeb;--rail-brand:#e8c766;--good:#49c98f;--good-soft:#16321f;--warn:#e0a84a;--warn-soft:#352a14;--bad:#f0685e;--bad-soft:#3a1c22;--info:#9d8bff;--info-soft:#221a3a}

/* Ocean — light teal/blue */
:root[data-theme="ocean"]{--bg:#eef4f8;--surface:#ffffff;--surface2:#e6eff5;--ink:#132430;--muted:#5a6b78;--line:#d3e2ec;--accent:#0e7490;--accent-soft:#d6eef4;--accent-ink:#ffffff;--navy:#0f2a3d;--navy2:#18405b;--rail:#0f2a3d;--rail2:#18425c;--rail-ink:#cfe3ef;--rail-brand:#7fd1e8;--good:#0f9d6b;--good-soft:#d6f2e7;--warn:#b5720a;--warn-soft:#faecd4;--bad:#c0392b;--bad-soft:#fbe4e1;--info:#1668b0;--info-soft:#e0edf8}
